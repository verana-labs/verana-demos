# Organization VS Agent deployment — Helm chart values (Verana v0.10.1+)
#
# Network (testnet/devnet) and service name are derived from the branch name.
# The workflow substitutes __NETWORK__, __VS_NAME__ and __CORPORATION_ID__
# placeholders at deploy time (CORPORATION_ID comes from config.env, set
# after running the "bootstrap-corporation" workflow step once).
# Example: vs/devnet-example → __NETWORK__=devnet, __VS_NAME__=example
chartSource: oci://registry-1.docker.io/veranalabs/vs-agent-chart
chartVersion: v2.0.0-dev.59

global:
  domain: __VS_NAME__.demos.__NETWORK__.verana.network

name: __VS_NAME__
replicas: 1

adminPort: 3000
didcommPort: 3001
didcommInvitationImageUrl: "https://verana.io/logo.svg"
publicDidMethod: "webvh"
enablePublicApiSwagger: true

# The agent classifies every Admin API request on the peer address of its TCP
# connection, and it never reads a forwarding header. A kubectl port-forward
# arrives on 127.0.0.1, so the setup script and the workflow are always
# trusted. The cluster pod CIDR is added for the chatbot applications, which
# reach this admin API through the cluster Service.
#
# This is also why the deployment publishes no admin ingress: the ingress
# controller runs inside the same pod CIDR, so an admin ingress on the admin
# port would serve the internet without authentication.
adminApiAuthMode: "internal"
adminApiTrustedNetworks: "127.0.0.0/8,::1/128,10.2.0.0/16"

# Verana network
veranaRpcEndpointUrl: "https://rpc.__NETWORK__.verana.network"
veranaIndexerBaseUrl: "https://idx.__NETWORK__.verana.network"
veranaChainId: "vna-__NETWORK__-1"
# Set by scripts/setup.sh's "bootstrap-corporation" step (corporation_id
# printed after granting operator authorization to this agent's own account).
veranaCorporationId: "__CORPORATION_ID__"

agentMode: "standalone"
# The shared ECS Ecosystem this service joins to obtain its own ECS
# credentials — see verana-deploy/scripts/ecs-ecosystem (devnet only).
trustedEcsEcosystemDids: "did:webvh:QmbDoPbwb4Nu2VLm2oSEUrnMokAzr5fCPu4c13Ysmov6SH:ecs-ecosystem.devnet.verana.network"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  host: "organization-vs.__VS_NAME__.demos.__NETWORK__.verana.network"
  tlsSecret: "organization-vs.__VS_NAME__.demos.__NETWORK__.verana.network-cert"
  public:
    enableCors: true
  private:
    enableCors: true
    whitelistSourceRange: ""
    tlsSecret: ""
    host: ""

extraEnv:
  # dev.59 accepts a level name only: trace, debug, info, warn, error or off.
  - name: AGENT_LOG_LEVEL
    value: "info"
  - name: USE_CORS
    value: "true"
  # This agent's ONLY account. It is the vs_operator of the Participant entries
  # the workflow assigns to this DID, and it holds no OperatorAuthorization.
  # ORGANIZATION_VS_MNEMONIC stays with the workflow, which is the Corporation
  # operator, so this MUST be a different account — the chain forbids one
  # account from holding both authorization types.
  - name: VERANA_ACCOUNT_MNEMONIC
    valueFrom:
      secretKeyRef:
        name: organization-vs-secrets
        key: ORGANIZATION_VS_AGENT_MNEMONIC
  # ECS credential claims [VSA-VTI-CFG-ENV-ECS]. The agent composes its own ECS
  # credentials from these. It sends the Organization claims on the onboarding
  # request it opens with ecs-org-issuer, which only validates them, and it
  # self-issues the Service credential against its own ISSUER entry.
  #
  # The two names differ on purpose. The Organization credential names the
  # legal entity; the Service credential names the service, and the Service
  # name is what an explorer shows for the ecosystem this agent controls.
  - name: ECS_CLAIMS_ORG_NAME
    value: "Verana Example Organization"
  - name: ECS_CLAIMS_ORG_LOGO_URI
    value: "https://verana.io/logo.svg"
  - name: ECS_CLAIMS_ORG_ORGANIZATION_KIND
    value: "PUBLIC"
  - name: ECS_CLAIMS_ORG_COUNTRY_CODE
    value: "CH"
  - name: ECS_CLAIMS_ORG_REGISTRY_ID
    value: "CH-CHE-123.456.789"
  - name: ECS_CLAIMS_ORG_REGISTRY_URI
    value: "https://www.zefix.ch"
  - name: ECS_CLAIMS_ORG_ADDRESS
    value: "Bahnhofstrasse 42, 8001 Zurich, Switzerland"
  - name: ECS_CLAIMS_SERVICE_NAME
    value: "Verana Example Ecosystem"
  - name: ECS_CLAIMS_SERVICE_TYPE
    value: "WEB_PORTAL"
  - name: ECS_CLAIMS_SERVICE_DESCRIPTION
    value: "Ecosystem controller of the Verana demo ecosystem"
  - name: ECS_CLAIMS_SERVICE_LOGO_URI
    value: "https://verana.io/logo.svg"
  - name: ECS_CLAIMS_SERVICE_MINIMUM_AGE_REQUIRED
    value: "18"
  - name: ECS_CLAIMS_SERVICE_TERMS_AND_CONDITIONS_URI
    value: "https://organization-vs.__VS_NAME__.demos.__NETWORK__.verana.network/vt/default/terms.html"
  - name: ECS_CLAIMS_SERVICE_PRIVACY_POLICY_URI
    value: "https://organization-vs.__VS_NAME__.demos.__NETWORK__.verana.network/vt/default/privacy.html"

storage:
  size: 1Gi
  storageClassName: csi-cinder-high-speed
