name: 4_ Deploy Issuer Web VS

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - bootstrap-corporation
          - deploy
          - onboard-issuer
          - deploy-web
          - all
        default: all
      corporation-id:
        description: >-
          issuer-web-vs's Corporation ID. Leave empty on the first run of
          "bootstrap-corporation" — it prints the new ID, which you must then
          set here (and in issuer-web-vs/config.env) for every later run.
        required: false
        type: string

jobs:
  deploy-issuer-web-vs:
    name: Deploy Issuer Web VS Agent and Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate branch and extract network
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "vs/testnet-main" ]; then
            echo "::error::Branch vs/testnet-main is reserved. Deploy from 'main' branch instead."
            exit 1
          elif [ "$BRANCH" = "main" ]; then
            NETWORK="devnet"
            VS_NAME="main"
          elif [[ "$BRANCH" =~ ^vs/(testnet|devnet)- ]]; then
            SUFFIX="${BRANCH#vs/}"
            NETWORK="${SUFFIX%%-*}"
            VS_NAME="${SUFFIX#*-}"
          else
            echo "::error::Branch must be 'main' or match vs/testnet-<name> or vs/devnet-<name> (current: $BRANCH)"
            exit 1
          fi
          echo "NETWORK=${NETWORK}" >> "$GITHUB_ENV"
          echo "VS_NAME=${VS_NAME}" >> "$GITHUB_ENV"
          echo "Branch: $BRANCH — Network: $NETWORK — Service: $VS_NAME"

      - name: Load configuration
        run: |
          set -a
          source issuer-web-vs/config.env
          set +a
          while IFS= read -r line; do
            key="${line%%=*}"
            echo "${key}=${!key}" >> "$GITHUB_ENV"
          done < <(grep -E '^[A-Z_]+=' issuer-web-vs/config.env)
          if [ -n "${{ inputs.corporation-id }}" ]; then
            echo "CORPORATION_ID=${{ inputs.corporation-id }}" >> "$GITHUB_ENV"
          fi

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBEEOF'
          ${{ secrets.KUBECONFIG_VERANA_DEV }}
          KUBEEOF

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.29.9'

      - name: Install veranad
        run: |
          VERANAD_VERSION="v0.10.2"
          curl -sfL "https://github.com/verana-labs/verana-node/releases/download/${VERANAD_VERSION}/veranad-linux-amd64" \
            -o /usr/local/bin/veranad
          chmod +x /usr/local/bin/veranad
          veranad version

      - name: Import account from mnemonic
        run: |
          echo "${{ secrets.ISSUER_WEB_VS_MNEMONIC }}" | veranad keys add "${{ env.USER_ACC }}" --recover --keyring-backend test

      # -----------------------------------------------------------------------
      # BOOTSTRAP-CORPORATION: create issuer-web-vs's own Corporation
      # -----------------------------------------------------------------------
      - name: "Bootstrap Corporation"
        if: inputs.step == 'bootstrap-corporation' || inputs.step == 'all'
        run: |
          source common/common.sh
          set_network_vars "$NETWORK"

          if [ -n "${CORPORATION_ID:-}" ]; then
            ok "CORPORATION_ID=$CORPORATION_ID already set — resolving to confirm it exists"
            resolve_corporation "$CORPORATION_ID"
          else
            create_corporation "did:example:issuer-web-vs-${CHAIN_ID}" "$EGF_DOC_URL" "" \
              '["/verana.pp.v1.MsgStartParticipantOP","/verana.pp.v1.MsgRenewParticipantOP","/verana.pp.v1.MsgCancelParticipantOPLastRequest"]'
            echo "::notice::Corporation created: CORPORATION_ID=$CORPORATION_ID"
            echo "::notice::Set 'corporation-id: $CORPORATION_ID' as the workflow input (and CORPORATION_ID in issuer-web-vs/config.env) before running 'deploy'."
          fi

      # -----------------------------------------------------------------------
      # DEPLOY: Install/upgrade VS Agent via Helm
      # -----------------------------------------------------------------------
      - name: Resolve organization-vs DID
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          ORG_PUBLIC_URL="https://organization-vs.${VS_NAME}.demos.${NETWORK}.verana.network"
          ORG_DID=$(curl -sf "${ORG_PUBLIC_URL}/.well-known/did.json" | jq -r '.id // empty')
          if [ -z "$ORG_DID" ]; then
            echo "::error::Could not fetch organization-vs DID from ${ORG_PUBLIC_URL}. Is organization-vs deployed?"
            exit 1
          fi
          echo "ORG_VS_DID=${ORG_DID}" >> "$GITHUB_ENV"
          echo "organization-vs DID: $ORG_DID"

      - name: Resolve deployment.yaml placeholders
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          if [ -z "${CORPORATION_ID:-}" ]; then
            echo "::error::CORPORATION_ID is not set. Run 'bootstrap-corporation' first."
            exit 1
          fi
          CHILD_VS_NAME="issuer-web-${VS_NAME}"
          sed -e "s/__NETWORK__/${NETWORK}/g" -e "s/__CHILD_VS_NAME__/${CHILD_VS_NAME}/g" -e "s/__VS_NAME__/${VS_NAME}/g" \
            -e "s/__CORPORATION_ID__/${CORPORATION_ID}/g" -e "s#__ORG_VS_DID__#${ORG_VS_DID}#g" \
            issuer-web-vs/deployment.yaml > /tmp/deployment-resolved.yaml
          echo "CHILD_VS_NAME=${CHILD_VS_NAME}" >> "$GITHUB_ENV"
          echo "--- Resolved deployment.yaml ---"
          cat /tmp/deployment-resolved.yaml

      - name: Parse deployment.yaml
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          CHART_SOURCE=$(yq '.chartSource' /tmp/deployment-resolved.yaml)
          CHART_VERSION=$(yq '.chartVersion' /tmp/deployment-resolved.yaml)
          CHART_NAMESPACE="${{ secrets.K8S_NAMESPACE }}"
          RELEASE_NAME=$(yq '.name' /tmp/deployment-resolved.yaml)
          INGRESS_HOST=$(yq '.ingress.host' /tmp/deployment-resolved.yaml)
          echo "CHART_SOURCE=${CHART_SOURCE}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "CHART_NAMESPACE=${CHART_NAMESPACE}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          echo "INGRESS_HOST=${INGRESS_HOST}" >> "$GITHUB_ENV"

      - name: Ensure agent secret exists
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          kubectl create namespace "$CHART_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$CHART_NAMESPACE" get secret issuer-web-vs-secrets > /dev/null 2>&1 || \
          kubectl -n "$CHART_NAMESPACE" create secret generic issuer-web-vs-secrets \
            --from-literal=ISSUER_WEB_VS_MNEMONIC="${{ secrets.ISSUER_WEB_VS_MNEMONIC }}"

      - name: Deploy VS Agent via Helm
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          yq 'del(.chartSource, .chartVersion)' /tmp/deployment-resolved.yaml > /tmp/helm-values.yaml
          yq -i '.didcommLabel = env(SERVICE_NAME)' /tmp/helm-values.yaml
          helm upgrade --install "$RELEASE_NAME" "$CHART_SOURCE" \
            --version "$CHART_VERSION" \
            --namespace "$CHART_NAMESPACE" --create-namespace \
            --values /tmp/helm-values.yaml \
            --wait --timeout 300s

      # -----------------------------------------------------------------------
      # ONBOARD-ISSUER: StartParticipantOP + validate on organization-vs
      # -----------------------------------------------------------------------
      - name: Port-forward child VS Agent
        if: inputs.step == 'onboard-issuer' || inputs.step == 'all'
        run: |
          RELEASE_NAME="${RELEASE_NAME:-issuer-web-${VS_NAME}}"
          kubectl port-forward -n "${{ secrets.K8S_NAMESPACE }}" "svc/$RELEASE_NAME" 3002:3000 &
          echo "CHILD_PF_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          curl -sf http://localhost:3002/v1/agent > /dev/null || {
            echo "::error::Port-forward to child VS-Agent failed"
            exit 1
          }

      - name: Port-forward organization VS Agent
        if: inputs.step == 'onboard-issuer' || inputs.step == 'all'
        run: |
          kubectl port-forward -n "${{ secrets.K8S_NAMESPACE }}" "svc/${VS_NAME}" 3000:3000 &
          echo "ORG_PF_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          curl -sf http://localhost:3000/v1/agent > /dev/null || {
            echo "::error::Port-forward to organization VS-Agent failed"
            exit 1
          }

      - name: Onboard as ISSUER on organization-vs's example schema
        if: inputs.step == 'onboard-issuer' || inputs.step == 'all'
        run: |
          if [ -z "${CORPORATION_ID:-}" ]; then
            echo "::error::CORPORATION_ID is not set. Run 'bootstrap-corporation' first."
            exit 1
          fi
          source common/common.sh
          set_network_vars "$NETWORK"
          resolve_corporation "$CORPORATION_ID"

          CHILD_DID=$(curl -sf "http://localhost:3002/v1/agent" | jq -r '.publicDid')
          ok "Child DID: $CHILD_DID"

          ORG_PUBLIC_URL="https://organization-vs.${VS_NAME}.demos.${NETWORK}.verana.network"
          CUSTOM_SCHEMA_ID=$(discover_custom_schema_id "${ORG_PUBLIC_URL}/.well-known/did.json")
          if [ -z "$CUSTOM_SCHEMA_ID" ]; then
            echo "::error::Could not discover the 'example' schema from organization-vs's DID document"
            exit 1
          fi
          ok "Organization-vs custom schema ID: $CUSTOM_SCHEMA_ID"

          if EXISTING_PARTICIPANT_ID=$(find_active_participant "$CUSTOM_SCHEMA_ID" "$PP_IDX_ROLE_ISSUER" "$CHILD_DID"); then
            ok "Active ISSUER participant already exists: $EXISTING_PARTICIPANT_ID — skipping"
          else
            ROOT_PARTICIPANT_ID=$(find_root_participant "$CUSTOM_SCHEMA_ID")
            if [ -z "$ROOT_PARTICIPANT_ID" ]; then
              echo "::error::Could not find the root participant for schema $CUSTOM_SCHEMA_ID"
              exit 1
            fi
            start_participant_op "$CORPORATION" "$PP_ROLE_ISSUER" "$ROOT_PARTICIPANT_ID" "$CHILD_DID" > /dev/null

            sleep 15
            validate_pending_flow "http://localhost:3000" "$CHILD_DID"
          fi

      # -----------------------------------------------------------------------
      # DEPLOY-WEB: Build and deploy Issuer Web service
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: inputs.step == 'deploy-web' || inputs.step == 'all'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        if: inputs.step == 'deploy-web' || inputs.step == 'all'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Issuer Web image
        if: inputs.step == 'deploy-web' || inputs.step == 'all'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./issuer-web-vs/issuer-web
          push: true
          tags: |
            veranalabs/issuer-web:${{ github.sha }}
            veranalabs/issuer-web:issuer-web-${{ env.VS_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Issuer Web App
        if: inputs.step == 'deploy-web' || inputs.step == 'all'
        run: |
          NAMESPACE="${{ secrets.K8S_NAMESPACE }}"
          RELEASE_NAME="issuer-web-${VS_NAME}"
          APP_NAME="issuer-web-app-${VS_NAME}"
          IMAGE="veranalabs/issuer-web:${{ github.sha }}"
          PORT="${ISSUER_WEB_PORT:-4001}"

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
            labels:
              app: ${APP_NAME}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${APP_NAME}
            template:
              metadata:
                labels:
                  app: ${APP_NAME}
                annotations:
                  deploy-timestamp: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              spec:
                containers:
                  - name: issuer-web
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: ${PORT}
                    env:
                      - name: VS_AGENT_ADMIN_URL
                        value: "http://${RELEASE_NAME}:3000"
                      - name: ORG_VS_ADMIN_URL
                        value: "http://${VS_NAME}:3000"
                      - name: ORG_VS_PUBLIC_URL
                        value: "https://organization-vs.${VS_NAME}.demos.${NETWORK}.verana.network"
                      - name: PORT
                        value: "${PORT}"
                      - name: SERVICE_NAME
                        value: "${SERVICE_NAME}"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: ${APP_NAME}
            ports:
              - port: ${PORT}
                targetPort: ${PORT}
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - app.issuer-web-vs.${VS_NAME}.demos.${NETWORK}.verana.network
                secretName: ${APP_NAME}-tls
            rules:
              - host: app.issuer-web-vs.${VS_NAME}.demos.${NETWORK}.verana.network
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${APP_NAME}
                          port:
                            number: ${PORT}
          EOF

          kubectl rollout status deployment/"${APP_NAME}" -n "$NAMESPACE" --timeout=300s

      - name: Configure VS-Agent EVENTS_BASE_URL
        if: inputs.step == 'deploy-web' || inputs.step == 'all'
        run: |
          RELEASE_NAME="issuer-web-${VS_NAME}"
          APP_NAME="issuer-web-app-${VS_NAME}"
          WEB_URL="http://${APP_NAME}:${ISSUER_WEB_PORT:-4001}/webhooks"
          kubectl set env statefulset/"${RELEASE_NAME}" \
            -n "${{ secrets.K8S_NAMESPACE }}" \
            EVENTS_BASE_URL="$WEB_URL"

      # -----------------------------------------------------------------------
      # CLEANUP
      # -----------------------------------------------------------------------
      - name: Stop port-forwards
        if: always()
        run: |
          [ -n "${CHILD_PF_PID:-}" ] && kill "$CHILD_PF_PID" 2>/dev/null || true
          [ -n "${ORG_PF_PID:-}" ] && kill "$ORG_PF_PID" 2>/dev/null || true
          true

      - name: Summary
        if: always()
        run: |
          echo "## Issuer Web VS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${INGRESS_HOST:-}" ]; then
            echo "- **VS Agent:** https://${INGRESS_HOST}/.well-known/did.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Network:** ${NETWORK:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service:** ${VS_NAME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Corporation ID:** ${CORPORATION_ID:-unset}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.step }}" = "deploy-web" ] || [ "${{ inputs.step }}" = "all" ]; then
            echo "- **Web App:** https://app.issuer-web-vs.${VS_NAME}.demos.${NETWORK}.verana.network" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Web Image:** veranalabs/issuer-web:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          fi
