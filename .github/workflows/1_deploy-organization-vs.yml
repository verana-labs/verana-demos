name: 1_ Deploy Organization VS

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - bootstrap-corporation
          - deploy
          - validate-ecs-onboarding
          - create-example-ecosystem
          - all
        default: all
      corporation-id:
        description: >-
          organization-vs's Corporation ID. Leave empty on the first run of
          "bootstrap-corporation" — it prints the new ID, which you must then
          set here (and in organization-vs/config.env) for every later run.
        required: false
        type: string

jobs:
  deploy-organization-vs:
    name: Deploy Organization VS Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate branch and extract network
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "vs/testnet-main" ]; then
            echo "::error::Branch vs/testnet-main is reserved. Deploy from 'main' branch instead."
            exit 1
          elif [ "$BRANCH" = "main" ]; then
            NETWORK="devnet"
            VS_NAME="main"
          elif [[ "$BRANCH" =~ ^vs/(testnet|devnet)- ]]; then
            SUFFIX="${BRANCH#vs/}"
            NETWORK="${SUFFIX%%-*}"
            VS_NAME="${SUFFIX#*-}"
          else
            echo "::error::Branch must be 'main' or match vs/testnet-<name> or vs/devnet-<name> (current: $BRANCH)"
            exit 1
          fi
          echo "NETWORK=${NETWORK}" >> "$GITHUB_ENV"
          echo "VS_NAME=${VS_NAME}" >> "$GITHUB_ENV"
          echo "Branch: $BRANCH — Network: $NETWORK — Service: $VS_NAME"

      - name: Load configuration
        run: |
          set -a
          source organization-vs/config.env
          set +a
          while IFS= read -r line; do
            key="${line%%=*}"
            echo "${key}=${!key}" >> "$GITHUB_ENV"
          done < <(grep -E '^[A-Z_]+=' organization-vs/config.env)
          if [ -n "${{ inputs.corporation-id }}" ]; then
            echo "CORPORATION_ID=${{ inputs.corporation-id }}" >> "$GITHUB_ENV"
          fi

      - name: Resolve deployment.yaml placeholders
        run: |
          sed -e "s/__NETWORK__/${NETWORK}/g" -e "s/__VS_NAME__/${VS_NAME}/g" \
            -e "s/__CORPORATION_ID__/${CORPORATION_ID}/g" \
            organization-vs/deployment.yaml > /tmp/deployment-resolved.yaml
          echo "--- Resolved deployment.yaml ---"
          cat /tmp/deployment-resolved.yaml

      - name: Parse deployment.yaml
        run: |
          CHART_SOURCE=$(yq '.chartSource' /tmp/deployment-resolved.yaml)
          CHART_VERSION=$(yq '.chartVersion' /tmp/deployment-resolved.yaml)
          CHART_NAMESPACE="${{ secrets.K8S_NAMESPACE }}"
          RELEASE_NAME=$(yq '.name' /tmp/deployment-resolved.yaml)
          INGRESS_HOST=$(yq '.ingress.host' /tmp/deployment-resolved.yaml)
          echo "CHART_SOURCE=${CHART_SOURCE}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "CHART_NAMESPACE=${CHART_NAMESPACE}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          echo "INGRESS_HOST=${INGRESS_HOST}" >> "$GITHUB_ENV"
          echo "Chart: $CHART_SOURCE@$CHART_VERSION → $CHART_NAMESPACE/$RELEASE_NAME"

      - name: Generate Helm values
        run: |
          yq 'del(.chartSource, .chartVersion)' /tmp/deployment-resolved.yaml > /tmp/helm-values.yaml
          yq -i '.didcommLabel = env(ORG_NAME)' /tmp/helm-values.yaml
          # Do NOT expose admin via Helm private ingress — a standalone
          # path-restricted ingress is deployed separately after Helm install.
          echo "--- Helm values ---"
          cat /tmp/helm-values.yaml

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBEEOF'
          ${{ secrets.KUBECONFIG_VERANA_DEV }}
          KUBEEOF

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.29.9'

      - name: Install veranad
        run: |
          VERANAD_VERSION="v0.10.2-dev.2"
          curl -sfL "https://github.com/verana-labs/verana-node/releases/download/${VERANAD_VERSION}/veranad-linux-amd64" \
            -o /usr/local/bin/veranad
          chmod +x /usr/local/bin/veranad
          veranad version

      # ORGANIZATION_VS_MNEMONIC is the Corporation operator, which signs every
      # transaction here. ORGANIZATION_VS_AGENT_MNEMONIC is the agent's own and
      # only account, imported so the workflow can read its address and name it
      # as the vs_operator of the Participant entries it assigns. The chain
      # forbids one account from holding both authorization types, so the two
      # secrets MUST hold different accounts.
      - name: Import accounts from mnemonics
        run: |
          echo "${{ secrets.ORGANIZATION_VS_MNEMONIC }}" | veranad keys add "${{ env.USER_ACC }}" --recover --keyring-backend test
          echo "${{ secrets.ORGANIZATION_VS_AGENT_MNEMONIC }}" | veranad keys add "${{ env.AGENT_ACC }}" --recover --keyring-backend test
          AGENT_ADDR=$(veranad keys show "${{ env.AGENT_ACC }}" -a --keyring-backend test)
          echo "AGENT_ADDR=${AGENT_ADDR}" >> "$GITHUB_ENV"
          echo "Agent account (vs_operator): ${AGENT_ADDR}"

      # -----------------------------------------------------------------------
      # BOOTSTRAP-CORPORATION: create organization-vs's own Corporation
      # -----------------------------------------------------------------------
      - name: "Bootstrap Corporation"
        if: inputs.step == 'bootstrap-corporation' || inputs.step == 'all'
        run: |
          source common/common.sh
          set_network_vars "$NETWORK"

          if [ -n "${CORPORATION_ID:-}" ]; then
            ok "CORPORATION_ID=$CORPORATION_ID already set — skipping (resolving policy_address to confirm it exists)"
            resolve_corporation "$CORPORATION_ID"
          else
            create_corporation "did:example:organization-vs-${CHAIN_ID}" "$EGF_DOC_URL"
            echo "::notice::Corporation created: CORPORATION_ID=$CORPORATION_ID"
            echo "::notice::Set 'corporation-id: $CORPORATION_ID' as the workflow input (and CORPORATION_ID in organization-vs/config.env) before running 'deploy'."
          fi

      # -----------------------------------------------------------------------
      # DEPLOY: Install/upgrade VS Agent via Helm
      # -----------------------------------------------------------------------
      - name: Ensure agent secret exists
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          kubectl create namespace "$CHART_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$CHART_NAMESPACE" get secret organization-vs-secrets > /dev/null 2>&1 || \
          kubectl -n "$CHART_NAMESPACE" create secret generic organization-vs-secrets \
            --from-literal=ORGANIZATION_VS_MNEMONIC="${{ secrets.ORGANIZATION_VS_MNEMONIC }}" \
            --from-literal=ORGANIZATION_VS_AGENT_MNEMONIC="${{ secrets.ORGANIZATION_VS_AGENT_MNEMONIC }}"

      - name: Deploy VS Agent via Helm
        if: inputs.step == 'deploy' || inputs.step == 'all'
        run: |
          if [ -z "${CORPORATION_ID:-}" ]; then
            echo "::error::CORPORATION_ID is not set. Run 'bootstrap-corporation' first."
            exit 1
          fi
          helm upgrade --install "$RELEASE_NAME" "$CHART_SOURCE" \
            --version "$CHART_VERSION" \
            --namespace "$CHART_NAMESPACE" --create-namespace \
            --values /tmp/helm-values.yaml \
            --wait --timeout 300s

      - name: Deploy admin ingress (Swagger UI only)
        if: (inputs.step == 'deploy' || inputs.step == 'all') && env.EXPOSE_ADMIN_API == 'true'
        run: |
          ADMIN_HOST="admin.${INGRESS_HOST}"
          ADMIN_SECRET="${ADMIN_HOST}-cert"
          cat <<EOF | kubectl apply -n "$CHART_NAMESPACE" -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admin-${RELEASE_NAME}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/enable-cors: "true"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${ADMIN_HOST}
                secretName: ${ADMIN_SECRET}
            rules:
              - host: ${ADMIN_HOST}
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: ${RELEASE_NAME}
                          port:
                            number: 3000
          EOF
          echo "Admin ingress deployed: https://${ADMIN_HOST}/api"

      # -----------------------------------------------------------------------
      # PORT-FORWARD: Access admin API via kubectl
      # -----------------------------------------------------------------------
      - name: Port-forward VS Agent admin API
        if: inputs.step == 'validate-ecs-onboarding' || inputs.step == 'create-example-ecosystem' || inputs.step == 'all'
        run: |
          kubectl port-forward -n "$CHART_NAMESPACE" "svc/$RELEASE_NAME" 3000:3000 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          curl -sf http://localhost:3000/v1/agent > /dev/null || {
            echo "Port-forward failed — is the $RELEASE_NAME pod running in $CHART_NAMESPACE?"
            exit 1
          }
          echo "Port-forward established"

      # The Organization credential comes from the service the ECS Ecosystem
      # corporation assigned the ISSUER entry to, not from the ecosystem agent.
      - name: Port-forward ecs-org-issuer admin API
        if: inputs.step == 'validate-ecs-onboarding' || inputs.step == 'all'
        run: |
          kubectl port-forward -n "$CHART_NAMESPACE" svc/ecs-org-issuer 3101:3000 &
          echo "ECS_PF_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          curl -sf http://localhost:3101/v1/agent > /dev/null || {
            echo "Port-forward to ecs-org-issuer failed — is it deployed in $CHART_NAMESPACE?"
            exit 1
          }
          echo "Port-forward established"

      # -----------------------------------------------------------------------
      # VALIDATE-ECS-ONBOARDING: approve organization-vs's pending vt-flow
      # -----------------------------------------------------------------------
      - name: "Validate ECS onboarding"
        if: inputs.step == 'validate-ecs-onboarding' || inputs.step == 'all'
        run: |
          source common/common.sh
          set_network_vars "$NETWORK"

          resolve_corporation "$CORPORATION_ID"

          AGENT_DID=$(curl -sf "http://localhost:3000/v1/agent" | jq -r '.publicDid')
          echo "AGENT_DID=${AGENT_DID}" >> "$GITHUB_ENV"
          ok "Agent DID: $AGENT_DID"

          # --- Assign the ECS Participant entries ------------------------------
          # The agent holds no OperatorAuthorization, so the Corporation
          # operator creates these, each naming AGENT_ADDR as its vs_operator.
          ECS_ORG_SCHEMA_ID=$(find_ecs_schema_id "$ECS_ECOSYSTEM_DID" "OrganizationCredential")
          ECS_SERVICE_SCHEMA_ID=$(find_ecs_schema_id "$ECS_ECOSYSTEM_DID" "ServiceCredential")
          ok "ECS schema IDs: organization=$ECS_ORG_SCHEMA_ID service=$ECS_SERVICE_SCHEMA_ID"

          ECS_ORG_ISSUER_DID=$(fetch_did_from_log "$ECS_ORG_ISSUER_PUBLIC_URL")
          ECS_ORG_ISSUER_PARTICIPANT_ID=$(find_active_participant \
            "$ECS_ORG_SCHEMA_ID" "$PP_IDX_ROLE_ISSUER" "$ECS_ORG_ISSUER_DID") || {
            echo "::error::$ECS_ORG_ISSUER_DID holds no active ISSUER entry on the ECS Organization schema"
            exit 1
          }
          ok "ECS Organization issuer participant: $ECS_ORG_ISSUER_PARTICIPANT_ID"

          # The Service schema is OPEN, so its entry needs no validation. The
          # agent uses it to anchor its own Service credential and to deliver
          # Service credentials to the delegated issuer-*/verifier- services.
          if ! find_participant_with_vs_operator "$ECS_SERVICE_SCHEMA_ID" "$PP_ROLE_ISSUER" "$AGENT_DID" \
               | grep -q "$AGENT_ADDR"; then
            ECS_SERVICE_ROOT_ID=$(find_root_participant "$ECS_SERVICE_SCHEMA_ID")
            self_create_participant "$CORPORATION" "$PP_ROLE_ISSUER" "$ECS_SERVICE_ROOT_ID" "$AGENT_DID" \
              "$AGENT_ADDR" "$VSOA_ISSUER"
          else
            ok "Service ISSUER entry already names $AGENT_ADDR"
          fi

          # HOLDER is the one role whose vs_operator may send TriggerResolver.
          if ! find_participant_with_vs_operator "$ECS_ORG_SCHEMA_ID" "$PP_ROLE_HOLDER" "$AGENT_DID" \
               | grep -q "$AGENT_ADDR"; then
            start_participant_op "$CORPORATION" "$PP_ROLE_HOLDER" "$ECS_ORG_ISSUER_PARTICIPANT_ID" "$AGENT_DID" \
              "$AGENT_ADDR" "$VSOA_HOLDER"
            log "Waiting for the agent to send the onboarding request..."
            sleep 20
          else
            ok "Organization HOLDER entry already names $AGENT_ADDR"
          fi

          # --- Complete the onboarding process --------------------------------
          if has_completed_flow "http://localhost:3101" "$AGENT_DID"; then
            ok "Already validated — skipping"
          else
            ORG_LOGO_DIGEST_SRI=$(sri_digest_sha384 "$ORG_LOGO_URI")
            ORG_CLAIMS=$(jq -c -n \
              --arg name "$ORG_NAME" \
              --arg logoUri "$ORG_LOGO_URI" \
              --arg logoDigestSri "$ORG_LOGO_DIGEST_SRI" \
              --arg registryId "$ORG_REGISTRY_ID" \
              --arg registryUri "$ORG_REGISTRY_URI" \
              --arg address "$ORG_ADDRESS" \
              --arg organizationKind "$ORG_ORGANIZATION_KIND" \
              --arg countryCode "$ORG_COUNTRY_CODE" \
              '{name: $name, logoUri: $logoUri, logoDigestSri: $logoDigestSri, registryId: $registryId,
                registryUri: $registryUri, address: $address, organizationKind: $organizationKind,
                countryCode: $countryCode}')
            validate_pending_flow "http://localhost:3101" "$AGENT_DID" "" "$ORG_CLAIMS"
          fi

      # -----------------------------------------------------------------------
      # CREATE-EXAMPLE-ECOSYSTEM: organization-vs's own Ecosystem + schema + root
      # -----------------------------------------------------------------------
      - name: "Create example ecosystem"
        if: inputs.step == 'create-example-ecosystem' || inputs.step == 'all'
        run: |
          source common/common.sh
          set_network_vars "$NETWORK"

          if [ -z "${CORPORATION_ID:-}" ]; then
            echo "::error::CORPORATION_ID is not set. Run 'bootstrap-corporation' first."
            exit 1
          fi
          resolve_corporation "$CORPORATION_ID"

          AGENT_DID="${AGENT_DID:-$(curl -sf "http://localhost:3000/v1/agent" | jq -r '.publicDid')}"
          log "Agent DID: $AGENT_DID"

          if ECOSYSTEM_ID=$(find_ecosystem_for_corporation "$CORPORATION_ID"); then
            ok "Ecosystem already exists: id=$ECOSYSTEM_ID — skipping"
          else
            create_ecosystem "$CORPORATION" "$AGENT_DID" "$EGF_DOC_URL"

            if [ -n "${CUSTOM_SCHEMA_URL:-}" ]; then
              SCHEMA_JSON=$(download_schema "$CUSTOM_SCHEMA_URL")
            else
              SCHEMA_JSON=$(jq -c '.' organization-vs/schema.json)
            fi

            CUSTOM_SCHEMA_ID=$(create_credential_schema "$CORPORATION" "$ECOSYSTEM_ID" "$SCHEMA_JSON" \
              "$ONBOARDING_MODE_ECOSYSTEM" "$ONBOARDING_MODE_OPEN" "$HOLDER_MODE_ISSUER_OP")

            create_root_participant "$CORPORATION" "$CUSTOM_SCHEMA_ID" "$AGENT_DID"
          fi

      # -----------------------------------------------------------------------
      # CLEANUP
      # -----------------------------------------------------------------------
      - name: Stop port-forwards
        if: always()
        run: |
          [ -n "${PF_PID:-}" ] && kill "$PF_PID" 2>/dev/null || true
          [ -n "${ECS_PF_PID:-}" ] && kill "$ECS_PF_PID" 2>/dev/null || true
          true

      # -----------------------------------------------------------------------
      # SUMMARY
      # -----------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "## Organization VS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${INGRESS_HOST:-}" ]; then
            echo "- **VS Agent:** https://${INGRESS_HOST}/.well-known/did.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Network:** ${NETWORK:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service:** ${VS_NAME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Corporation ID:** ${CORPORATION_ID:-unset}" >> "$GITHUB_STEP_SUMMARY"
